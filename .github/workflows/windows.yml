name: Native checks and packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        description: Exact release commit to check and package
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-checks:
    name: Release configuration and recovery tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
      - uses: astral-sh/setup-uv@v7
      - name: Check GitHub workflows
        uses: docker://rhysd/actionlint:1.7.12
      - name: Check release upload script
        run: |
          bash -n packaging/upload-release.sh
          shellcheck packaging/upload-release.sh
      - name: Install pinned changenote CLI
        run: cargo install --git https://github.com/narumiruna/changenote --rev f4423760122463bf03a8d161c6f0bc4173afb6e0 --locked
      - name: Prepare offline Cargo version updates
        run: cargo fetch --locked
      - name: Validate pending release notes
        run: changenote status
      - name: Test version updates and release asset recovery
        env:
          CHANGENOTE_BIN: changenote
        run: uv run --no-project python -m unittest discover -s tests/release -v

  test-and-package:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: mangameeya-rust-windows
            artifact_paths: target/release/bundle/nsis/*-setup.exe
          - runner: macos-15
            target: aarch64-apple-darwin
            artifact_name: mangameeya-rust-macos-arm64
            artifact_paths: |
              target/release/bundle/macos/aarch64-apple-darwin/*.zip
              target/release/bundle/macos/aarch64-apple-darwin/*.dmg
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            artifact_name: mangameeya-rust-macos-x86_64
            artifact_paths: |
              target/release/bundle/macos/x86_64-apple-darwin/*.zip
              target/release/bundle/macos/x86_64-apple-darwin/*.dmg
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false

      - name: Select full Xcode and check Metal compiler
        if: runner.os == 'macOS'
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
        run: |
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          echo 'MACOSX_DEPLOYMENT_TARGET=12.0' >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun --sdk macosx metal --version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          targets: ${{ matrix.target }}
          components: clippy, rustfmt

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Test Rust application and launch IPC
        run: cargo test --locked --all-features

      - name: Test production UI interactions and macOS Metal rendering
        run: cargo test --locked --test rendering

      - name: Lint Rust application
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows application and current-user installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/build.ps1

      - name: Test silent current-user install, associations, and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem target/release/bundle/nsis/*-setup.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one NSIS installer.' }
          ./packaging/windows/test-installer.ps1 -InstallerPath $installers[0].FullName

      - name: Build macOS application, ZIP, and DMG
        if: runner.os == 'macOS'
        run: bash packaging/macos/build.sh '${{ matrix.target }}'

      - name: Upload native packages
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error

      - name: Upload macOS UI smoke screenshots
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v6
        with:
          name: mangameeya-rust-ui-smoke-${{ matrix.target }}
          path: target/ui-smoke/*.png
          if-no-files-found: ignore
