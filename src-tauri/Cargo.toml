[package]
name = "mangameeya-rust"
version = "0.1.0"
description = "A Windows manga reader inspired by MangaMeeyaCE"
authors = ["MangaMeeya Rust contributors"]
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"

[lib]
name = "mangameeya_rust_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-single-instance"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
base64 = "0.22.1"
natord = "1.0.9"
rars = "0.9.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.5", features = [], optional = true }
tauri-plugin-dialog = { version = "2.7.2", optional = true }
tauri-plugin-single-instance = { version = "2.4.3", optional = true }
zip = { version = "8.2.0", default-features = false, features = ["deflate", "deflate64", "bzip2", "lzma", "xz"] }

[dev-dependencies]
tempfile = "3.27.0"
