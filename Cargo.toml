[package]
name = "mangameeya-rust"
version = "0.7.0"
edition = "2024"
rust-version = "1.99"
description = "A native manga reader for Windows and macOS, built with Rust and GPUI Kit"
license = "AGPL-3.0-only"
repository = "https://github.com/narumiruna/mangameeya-rust"

[dependencies]
gpui-kit = "=0.9.0"
anyhow = "1"
directories = "6"
fs2 = "0.4"
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"] }
natord = "1.0.9"
same-file = "1.0"
semver = "1"
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
url = "2"
rars = "0.9.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27"
zip = { version = "8.2", default-features = false, features = ["deflate", "deflate64", "bzip2", "lzma", "xz"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
gpui-kit = { version = "=0.9.0", features = ["test-support"] }

[[test]]
name = "rendering"
path = "tests/rendering.rs"
harness = false
test = false

[profile.dev]
debug = "line-tables-only"

[profile.release]
strip = "symbols"

[lints.clippy]
todo = "deny"
